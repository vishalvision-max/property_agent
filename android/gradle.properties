# JVM memory settings (safe for modern Android builds)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

# Enable AndroidX (required for Flutter)
android.useAndroidX=true
android.enableJetifier=true

# Prevent Gradle from failing on minor warnings (IMPORTANT)
org.gradle.warning.mode=none

# Improve build stability for modern SDKs
android.suppressUnsupportedCompileSdk=34
android.allWarningsAsErrors=false
